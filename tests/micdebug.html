<!doctype html>
<meta charset="utf-8" />
<pre id="out">running</pre>
<script type="module">
	// Scratch page: one realistic note at a time, printing every pitch decision.
	import { NoteListener, HOP } from "../js/pitch.js"
	const SR = 48000, hz = p => 440 * Math.pow(2, (p - 69) / 12)
	const name = p => ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"][p % 12] + (Math.floor(p / 12) - 1)
	const src = await (await fetch("mic.html")).text()
	const out = []
	let seed = 1
	const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 2 - 1
	// pull piano() and reverb() out of mic.html so the two stay the same
	const body = src.slice(src.indexOf("	// real: closer"), src.indexOf("	function listen("))
	const make = new Function("SR", "hz", "rnd", body + "; return piano")
	const piano = make(SR, hz, rnd)
	// ?n=60+64+67,65 (chords with +), &step=0.8, &expect (the game expects what's played), &pedal
	const q = new URLSearchParams(location.search), step = +(q.get("step") || 0.4)
	const notes = (q.get("n") || "65").split(",").flatMap((c, i) => c.split(/[+ _]/).map(p => ({ t: 0.5 + i * step, d: step * 0.9, p: +p })))
	const L = piano(notes, notes[notes.length - 1].t + 1.2, { real: true, pedal: q.has("pedal") })
	const nl = new NoteListener(SR)
	if (q.has("expect")) nl.expect = ts => notes.filter(n => Math.abs(n.t - ts / 1000) < 0.2).map(n => n.p)
	nl.debug = []
	for (let i = 0; i + HOP <= L.length; i += HOP) for (const e of nl.push(L.subarray(i, i + HOP), ((i + HOP) / SR) * 1000)) if (e.type === "on") out.push(`ON ${name(e.p)} @${(e.ts / 1000).toFixed(2)}`)
	for (const d of nl.debug) out.push(`${(d.ts / 1000).toFixed(2)} ${name(d.p)} ${d.ok ? "OK " : "no "} s=${d.s} rel=${d.rel} ${d.failed} [${d.peaks.join(" ")}]`)
	document.getElementById("out").textContent = out.join("\n")
</script>
